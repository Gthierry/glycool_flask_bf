<div class="login-section py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-7 col-sm-9">
                <div class="card border-success-subtle shadow-sm">
                    <div class="card-header bg-success-subtle text-center">
                        <h1 class="h3 text-success-emphasis mb-0">Connexion</h1>
                    </div>
                    <div class="card-body p-4">
                        <form (ngSubmit)="connexion()" [formGroup]="form">
                            <!-- Email input -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold" for="form2Example2">Adresse email :</label>
                                <input type="email" formControlName="email" id="form2Example2"
                                    class="form-control border-success-subtle" />
                            </div>

                            <!-- Password input -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold" for="form2Example1">Mot de passe :</label>
                                <input type="password" formControlName="password" id="form2Example1"
                                    class="form-control border-success-subtle" />
                            </div>

                            <!-- Options row -->
                            <div class="row mb-3">
                                <div class="col-6">
                                    <!-- Checkbox -->
                                    <div class="form-check">
                                        <input class="form-check-input border-success" type="checkbox" value=""
                                            id="form2Example31" />
                                        <label class="form-check-label small" for="form2Example31">Se souvenir de
                                            moi</label>
                                    </div>
                                </div>
                                <div class="col-6 text-end">
                                    <!-- Simple link -->
                                    <a class="text-success text-decoration-none small" href="#!">Mot de passe oublié
                                        ?</a>
                                </div>
                            </div>

                            <!-- Submit button -->
                            <div class="d-grid">
                                <button type="submit" class="btn btn-success btn-lg">Se connecter</button>
                            </div>

                            <!-- Registration link -->
                            <div class="text-center mt-3">
                                <p class="small text-muted mb-0">Pas encore de compte ? <a href="/register"
                                        class="text-success text-decoration-none">Créer un compte</a></p>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
