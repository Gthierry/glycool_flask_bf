<!-- contacts.html -->
<div class="container-fluid py-4">
    <!-- Header Card with Search -->
    <div class="card border-success-subtle shadow-sm mb-4">
        <div class="card-header bg-success-subtle">
            <div class="d-flex justify-content-between align-items-center">
                <h5 class="text-success-emphasis mb-0">
                    <i class="bi bi-people me-2"></i>Mes contacts
                </h5>
                <button type="button" class="btn btn-success btn-sm" data-bs-toggle="modal"
                    data-bs-target="#addContactModal">
                    <i class="bi bi-person-plus me-2"></i>Ajouter un contact
                </button>
            </div>



        </div>
        <div class="card-body">
            <!-- Search and Filter -->
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <div class="input-group">
                        <span class="input-group-text border-success-subtle bg-white">
                            <i class="bi bi-search text-success"></i>
                        </span>
                        <input type="text" class="form-control border-success-subtle"
                            placeholder="Rechercher un contact...">
                    </div>



                </div>
                <!-- <div class="col-md-3">
                    <select class="form-select border-success-subtle">
                        <option selected>Tous les contacts</option>
                        <option>Médecins</option>
                        <option>Diététiciens</option>
                        <option>Communauté</option>
                        <option>Famille</option>
                    </select>
                </div> -->
                <div class="col-md-3">
                    <select class="form-select border-success-subtle">
                        <option selected>Trier par nom</option>
                        <option>Récemment ajouté</option>
                        <option>Plus actifs</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <!-- Contacts Grid -->
    <div class="card border-success-subtle shadow-sm">
        <div class="card-header bg-success-subtle">
            <h6 class="text-success-emphasis mb-0">
                <i class="bi bi-grid-3x3-gap me-2"></i>Liste des contacts ({{ contactListSignal().length }})
            </h6>
        </div>
        <div class="card-body">

            <div class="row g-3">

                @for(contact of contactListSignal(); track contact.user_id) {

                <!-- Contact 1 -->
                <div class="col-xl-4 col-lg-6 col-md-6">
                    <div class="card border-success-subtle h-100">
                        <div class="card-body text-center p-3">
                            <div class="position-relative d-inline-block mb-3">
                                <img src="profil-images/default.png" alt="Stephanie" class="rounded-circle" width="60"
                                    height="60" style="object-fit: cover;">

                            </div>

                            <h6 class="card-title text-success-emphasis mb-1">{{contact.username}}</h6>
                            <p class="card-text text-muted small mb-2"></p>
                            <!-- <div class="mb-3">
                                <span class="badge bg-info-subtle text-info-emphasis"></span>
                                <span class="badge bg-success-subtle text-success-emphasis">En ligne</span>
                            </div> -->
                            <div class="d-flex justify-content-center mt-4 gap-2">
                                <!-- <button class="btn btn-outline-success btn-sm">
                                    <i class="bi bi-envelope">Retirer</i>
                                </button> -->
                                <button class="btn btn-outline-success btn-sm">
                                    <i class="bi bi-telephone">Profil</i>
                                </button>
                                <button class="btn btn-outline-success btn-sm" >
                                    <i class="bi bi-chat-dots">Envoyer un message</i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                }










            </div>

            <!-- Empty State ou Load More -->
            <div class="text-center py-4 mt-4">
                <button class="btn btn-outline-success">
                    <i class="bi bi-arrow-clockwise me-2"></i>Charger plus de contacts
                </button>
            </div>
        </div>
    </div>
