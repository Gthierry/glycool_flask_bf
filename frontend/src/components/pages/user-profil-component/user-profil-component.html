<div class="profile-section py-5">
    <div class="container">
        <div class="row g-4">
            <!-- Sidebar Profile -->
            <div class="col-lg-4">
                <div class="card border-success-subtle shadow-sm h-100">
                    <div class="card-header bg-success-subtle text-center">
                        <div class="card-header bg-success-subtle text-center">
                            <div class="d-flex flex-column align-items-center mb-3">
                                <img src="profil-images/20180506_162941.jpg" alt="Photo de profil"
                                    class="rounded-circle mb-2" width="120" height="120" style="object-fit: cover;">
                                <button class="btn btn-sm btn-outline-success" data-bs-toggle="modal"
                                    data-bs-target="#imageModal">Modifier
                                    image</button>
                            </div>
                            <h4 class="text-success-emphasis mb-0">{{user?.username || 'Utilisateur'}}</h4>
                        </div>
                    </div>
                    <div class="card-body p-0">
                        <div class="list-group list-group-flush">
                            <a routerLink="/profil/informations" routerLinkActive="active"
                                class="list-group-item list-group-item-action border-success-subtle">
                                <i class="bi bi-people me-2"></i>Profil
                            </a>
                            <a routerLink="/profil/contacts" routerLinkActive="active"
                                class="list-group-item list-group-item-action border-success-subtle">
                                <i class="bi bi-people me-2"></i>Contacts
                            </a>
                            <a routerLink="/profil/messages" routerLinkActive="active"
                                class="list-group-item list-group-item-action border-success-subtle">
                                <i class="bi bi-envelope me-2" routerLink="messages"></i>Messages
                            </a>
                            <a href="#" class="list-group-item list-group-item-action border-success-subtle">
                                <i class="bi bi-chat-dots me-2"></i>Forum
                            </a>
                            <a href="#" class="list-group-item list-group-item-action border-success-subtle">
                                <i class="bi bi-book me-2"></i>Vos recettes
                            </a>
                            <a href="#" class="list-group-item list-group-item-action border-success-subtle">
                                <i class="bi bi-newspaper me-2"></i>Vos articles
                            </a>
                            <a routerLink="/profil/infos-profil" routerLinkActive="active"
                                class="list-group-item list-group-item-action border-success-subtle">
                                <i class="bi bi-pencil-square me-2"></i>Éditer le profil
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Main Content Area -->
            <div class="col-lg-8">
                <router-outlet></router-outlet>

            </div>
        </div>
    </div>
</div>
<!-- Modal pour charger une image -->
<div class="modal fade" id="imageModal" tabindex="-1" aria-labelledby="imageModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-success-subtle">
                <h5 class="modal-title text-success-emphasis" id="imageModalLabel">
                    <i class="bi bi-image me-2"></i>Modifier l'image de profil
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body text-center">
                <!--hidden input to insert the image file #image=name of input passed add the button action click loadButton-->
                <input type="file" #image (change)="onFilesSelected($event)" style="display: none" />
                <button class="btn btn-success w-100 mb-3" (click)="loadImage(image)">
                    Charger depuis l'ordinateur
                </button>'
                <button class="btn btn-success w-100 mb-3">
                    Charger depuis une url'
                    <input type="text" class="d-none" accept="image/*">
                </button>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>

            </div>
        </div>
    </div>
</div>
