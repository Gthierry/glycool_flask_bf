<div class="profile-section py-5">
    <div class="container">
        <div class="row g-4">
            <!-- Sidebar Profile -->
            <div class="col-lg-4">
                <div class="card border-success-subtle shadow-sm h-100">
                    <div class="card-header bg-success-subtle text-center">
                        <div class="position-relative d-inline-block mb-3">
                            <img src="profil-images/20180506_162941.jpg" alt="Photo de profil" class="rounded-circle"
                                width="120" height="120" style="object-fit: cover;">
                        </div>
                        <h4 class="text-success-emphasis mb-0">{{user?.username || 'Utilisateur'}}</h4>
                    </div>
                    <div class="card-body p-0">
                        <div class="list-group list-group-flush">
                            <a routerLink="/profil/informations" routerLinkActive="active"
                                class="list-group-item list-group-item-action border-success-subtle">
                                <i class="bi bi-people me-2"></i>Profil
                            </a>
                            <a href="#" class="list-group-item list-group-item-action border-success-subtle">
                                <i class="bi bi-people me-2"></i>Contacts
                            </a>
                            <a routerLink="/profil/messages" routerLinkActive="active"
                                class="list-group-item list-group-item-action border-success-subtle">
                                <i class="bi bi-envelope me-2" routerLink="messages"></i>Messages
                            </a>
                            <a href="#" class="list-group-item list-group-item-action border-success-subtle">
                                <i class="bi bi-chat-dots me-2"></i>Forum
                            </a>
                            <a href="#" class="list-group-item list-group-item-action border-success-subtle">
                                <i class="bi bi-book me-2"></i>Vos recettes
                            </a>
                            <a href="#" class="list-group-item list-group-item-action border-success-subtle">
                                <i class="bi bi-newspaper me-2"></i>Vos articles
                            </a>
                            <a routerLink="/profil/infos-profil" routerLinkActive="active"
                                class="list-group-item list-group-item-action border-success-subtle">
                                <i class="bi bi-pencil-square me-2"></i>Éditer le profil
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Main Content Area -->
            <div class="col-lg-8">
                <router-outlet></router-outlet>

            </div>
        </div>
    </div>
</div>
